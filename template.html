<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reading List — recent articles</title>
    <meta
      name="description"
      content="A weekly reading list aggregated from a handful of writers I follow."
    />
    <!--@styles--><!--/@styles-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='13' font-size='13'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <h1>Reading list</h1>
        <p class="meta" id="meta" hidden><!--@meta--><!--/@meta--></p>
        <div class="quick-filter" id="quick-filter" role="group" aria-label="Filter by category">
          <button type="button" class="quick-filter__pill is-active" data-category="newsletter" aria-pressed="true">Newsletters</button>
          <button type="button" class="quick-filter__pill" data-category="youtube" aria-pressed="false">YouTube</button>
          <button type="button" class="quick-filter__pill is-active" data-category="article" aria-pressed="true">Articles</button>
        </div>
      </header>

      <section id="content" aria-live="polite">
        <!--@content--><p id="status">Loading…</p><!--/@content-->
      </section>

      <div id="failures"><!--@failures--><!--/@failures--></div>

      <footer class="page__footer">
        <p class="colophon" id="colophon"><!--@colophon--><!--/@colophon--></p>
      </footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
